
name: PC Comunidade - Windows

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Número da instância (1-10)"
        required: true
        default: "1"
        type: string

jobs:
  diagnose-pc:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Informações do sistema
        shell: pwsh
        run: |
          Write-Host "=== PC DA COMUNIDADE ===" -ForegroundColor Green
          Write-Host "Instância: ${{ inputs.instance_number }}"

          Get-ComputerInfo |
            Select-Object WindowsProductName,
              WindowsVersion, OsArchitecture

          Write-Host "`n=== PROCESSADOR ==="
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores,
              NumberOfLogicalProcessors |
            Format-List

          Write-Host "`n=== MEMÓRIA ==="
          Get-CimInstance Win32_ComputerSystem |
            Select-Object @{Name="RAM_GB";Expression={
              [math]::Round($_.TotalPhysicalMemory / 1GB, 2)
            }} |
            Format-List

      - name: Otimização básica do Windows
        shell: pwsh
        run: |
          Write-Host "=== OTIMIZANDO WINDOWS ===" -ForegroundColor Cyan

          # Tentar ativar o plano de alto desempenho
          powercfg /setactive SCHEME_MIN

          # Reduzir efeitos visuais
          $visualPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects"

          New-Item -Path $visualPath -Force |
            Out-Null

          Set-ItemProperty `
            -Path $visualPath `
            -Name VisualFXSetting `
            -Type DWord `
            -Value 2

          # Desativar transparência para a conta atual
          $personalize = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item -Path $personalize -Force |
            Out-Null

          Set-ItemProperty `
            -Path $personalize `
            -Name EnableTransparency `
            -Type DWord `
            -Value 0

          Write-Host "Ajustes concluídos."

      - name: Diagnóstico da GPU
        shell: pwsh
        run: |
          Write-Host "=== ADAPTADORES GRÁFICOS ===" -ForegroundColor Cyan

          $gpus = Get-CimInstance Win32_VideoController

          if ($gpus) {
            foreach ($gpu in $gpus) {
              Write-Host "Nome: $($gpu.Name)"
              Write-Host "Driver: $($gpu.DriverVersion)"
              Write-Host "Processador gráfico: $($gpu.VideoProcessor)"
              Write-Host "Memória informada: $($gpu.AdapterRAM)"
              Write-Host "Status: $($gpu.Status)"
              Write-Host "---------------------------"
            }
          } else {
            Write-Host "Nenhum adaptador encontrado."
          }

          Write-Host "`n=== DIRECTX ==="
          Get-ItemProperty `
            "HKLM:\SOFTWARE\Microsoft\DirectX" `
            -ErrorAction SilentlyContinue |
            Select-Object Version |
            Format-List

      - name: Verificar armazenamento
        shell: pwsh
        run: |
          Write-Host "=== DISCOS ===" -ForegroundColor Cyan

          Get-CimInstance Win32_LogicalDisk |
            Where-Object DriveType -eq 3 |
            Select-Object DeviceID,
              @{Name="Livre_GB";Expression={
                [math]::Round($_.FreeSpace / 1GB, 2)
              }},
              @{Name="Total_GB";Expression={
                [math]::Round($_.Size / 1GB, 2)
              }} |
            Format-Table -AutoSize

      - name: Resumo da execução
        shell: pwsh
        run: |
          Write-Host "=== DIAGNÓSTICO CONCLUÍDO ===" -ForegroundColor Green
          Write-Host "Instância: ${{ inputs.instance_number }}"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Sistema: Windows"
          Write-Host "A máquina é temporária e será encerrada."
          
